# ABOUTME: Runs the HOL plugin scanner the awesome-ai-plugins catalog gates listings on
# ABOUTME: Fails on any high finding or a score under 80; both actions pinned by commit
name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
