f5f9a342910b8d627fade38554ee4f52c778b5b8722e"},"dark":{"file":"tmux-pane-1-dark.ansi","crop":[0,18],"sha256":"adede016b72ebb060ea1a0cd7debac46291f018e373f0d222247e31e7c9ded5f"}}},{"label":"The retry offer","captures":{"light":{"file":"tmux-pane-2-light.ansi","crop":[0,41],"sha256":"d724dd8171454f40101b8eeabda1d2559f76abae6979e1a002f0cb444e21520e"},"dark":{"file":"tmux-pane-2-dark.ansi","crop":[0,40],"sha256":"e00991c6953515783350e57d4499ae1f6bc0e0e1bc642ff2afad0ef98618ed5d"}}}],"columns":110,"seconds_per_frame":2.5,"layout":{"font":13,"cell":7.8,"line":22,"padding":24}}</metadata><style>text{font-family:Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13px;white-space:pre;font-variant-numeric:tabular-nums;font-variant-ligatures:none}.b{font-weight:700}.d{opacity:.5}.i{font-style:italic}.u{text-decoration:underline}.theme-dark{display:none}@media(prefers-color-scheme:dark){.theme-light{display:none}.theme-dark{display:inline}}@media(prefers-reduced-motion:reduce){.frame{display:none}.frame.first{display:inline;opacity:1!important}.frame animate{display:none}}.p2{fill:#b91c1c}.p3{fill:#fca5a5}.p4{fill:#64748b}.p11{fill:#1e40af}.p12{fill:#ffffff}.p14{fill:#008080}.p16{fill:#e5e7eb}</style><g class="frame first" opacity="1" data-frame="0"><animate attributeName="opacity" values="1;0;0;1" keyTimes="0.000000;0.333333;0.666667;1.000000" calcMode="discrete" dur="7.5s" repeatCount="indefinite" /><g fill="#302a24" class="theme-light"><rect width="906" height="950" rx="8" fill="#fbf6e9" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 194.72)"><use href="#t5" /><text x="54.6" y="0" textLength="163.8" fill="#585858">council is waiting on</text><use href="#t6" /><text x="280.8" y="0" textLength="15.6" fill="#585858">, </text><use href="#t7" /><text x="382.2" y="0" textLength="15.6" fill="#585858">, </text><use href="#t8" /><text x="460.2" y="0" textLength="15.6" fill="#585858">, </text><use href="#t9" /></g></g><g fill="#eeeeee" class="theme-dark"><rect width="906" height="950" rx="8" fill="#191919" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 194.72)"><use href="#t5" /><text x="54.6" y="0" textLength="163.8" class="d">council is waiting on</text><use href="#t6" /><text x="280.8" y="0" textLength="15.6" class="d">, </text><use href="#t7" /><text x="382.2" y="0" textLength="15.6" class="d">, </text><use href="#t8" /><text x="460.2" y="0" textLength="15.6" class="d">, </text><use href="#t9" /></g></g></g><g class="frame" opacity="0" data-frame="1"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.000000;0.333333;0.666667;1.000000" calcMode="discrete" dur="7.5s" repeatCount="indefinite" /><g fill="#302a24" class="theme-light"><rect width="906" height="950" rx="8" fill="#fbf6e9" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 216.72)"><use href="#t10" /></g><g transform="translate(24 238.72)"><use href="#t11" /></g><g transform="translate(24 304.72)"><use href="#t12" /></g><g transform="translate(24 326.72)"><use href="#t13" /></g><g transform="translate(24 348.72)"><use href="#t14" /></g><rect x="24" y="398" width="109.2" height="22" class="p11" /><rect x="133.2" y="398" width="179.4" height="22" class="p11" /><rect x="312.6" y="398" width="7.8" height="22" class="p11" /><rect x="320.4" y="398" width="54.6" height="22" class="p11" /><rect x="375" y="398" width="15.6" height="22" class="p11" /><g transform="translate(24 414.72)"><use href="#t15" /><use href="#t16" /><use href="#t17" /></g></g><g fill="#eeeeee" class="theme-dark"><rect width="906" height="950" rx="8" fill="#191919" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 216.72)"><use href="#t10" /></g><g transform="translate(24 238.72)"><use href="#t11" /></g><g transform="translate(24 304.72)"><use href="#t12" /></g><g transform="translate(24 326.72)"><use href="#t13" /></g><g transform="translate(24 348.72)"><use href="#t14" /></g><rect x="24" y="398" width="109.2" height="22" class="p11" /><rect x="133.2" y="398" width="179.4" height="22" class="p11" /><rect x="312.6" y="398" width="7.8" height="22" class="p11" /><rect x="320.4" y="398" width="54.6" height="22" class="p11" /><rect x="375" y="398" width="15.6" height="22" class="p11" /><g transform="translate(24 414.72)"><use href="#t15" /><use href="#t16" /><use href="#t18" /></g></g></g><g class="frame" opacity="0" data-frame="2"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0.000000;0.333333;0.666667;1.000000" calcMode="discrete" dur="7.5s" repeatCount="indefinite" /><g fill="#302a24" class="theme-light"><rect width="906" height="950" rx="8" fill="#fbf6e9" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 216.72)"><use href="#t10" /></g><g transform="translate(24 238.72)"><use href="#t11" /></g><g transform="translate(24 304.72)"><use href="#t12" /></g><g transform="translate(24 326.72)"><use href="#t13" /></g><g transform="translate(24 348.72)"><use href="#t14" /></g><rect x="24" y="398" width="109.2" height="22" class="p11" /><rect x="133.2" y="398" width="179.4" height="22" class="p11" /><rect x="312.6" y="398" width="7.8" height="22" class="p11" /><rect x="320.4" y="398" width="54.6" height="22" class="p11" /><rect x="375" y="398" width="15.6" height="22" class="p11" /><g transform="translate(24 414.72)"><use href="#t15" /><use href="#t16" /><use href="#t17" /></g><g transform="translate(24 458.72)"><use href="#t19" /><use href="#t20" /><text x="265.2" y="0" textLength="561.6"> is the recommended choice due to its simplicity and zero configuration.</text></g><g transform="translate(24 502.72)"><use href="#t21" /><text x="23.4" y="0" textLength="202.8" class="b">Zero operational overhead:</text><text x="226.2" y="0" textLength="624"> SQLite runs embedded in-process, eliminating the need to install, configure, or</text></g><g transform="translate(24 524.72)"><text x="23.4" y="0" textLength="483.6">manage background database daemons and connection credentials.</text></g><g transform="translate(24 546.72)"><use href="#t21" /><text x="23.4" y="0" textLength="179.4" class="b">Effortless portability:</text><text x="202.8" y="0" textLength="631.8"> The entire database resides in a single file, making it trivial to reset, share,</text></g><g transform="translate(24 568.72)"><text x="23.4" y="0" textLength="382.2">snapshot, or distribute alongside your demo code.</text></g><g transform="translate(24 590.72)"><use href="#t21" /><text x="23.4" y="0" textLength="187.2" class="b">When to choose Postgres:</text><text x="210.6" y="0" textLength="585"> Opt for Postgres only if your demo explicitly showcases Postgres-exclusive</text></g><g transform="translate(24 612.72)"><text x="23.4" y="0" textLength="140.4">features, such as </text><text x="163.8" y="0" textLength="62.4" fill="#808000">pgvector</text><text x="226.2" y="0" textLength="436.8">, specialized extensions, or complex concurrency models.</text></g><rect x="24" y="662" width="62.4" height="22" class="p16" /><rect x="86.4" y="662" width="85.8" height="22" class="p16" /><rect x="172.2" y="662" width="7.8" height="22" class="p16" /><rect x="180" y="662" width="54.6" height="22" class="p16" /><rect x="234.6" y="662" width="15.6" height="22" class="p16" /><g transform="translate(24 678.72)"><use href="#t22" /><use href="#t23" /><text x="156" y="0" textLength="54.6" fill="#1f2937" class="i">(39.9s)</text></g><g transform="translate(24 744.72)"><use href="#t21" /><use href="#t24" /><text x="70.2" y="0" textLength="78" class="b">use SQLite</text><text x="148.2" y="0" textLength="678.6"> for a single-node demo: it runs inside your app and needs no separate database server,</text></g><g transform="translate(24 766.72)"><text x="23.4" y="0" textLength="304.2">making setup and distribution simpler. </text><text x="327.6" y="0" textLength="117" class="u p14">SQLite guidance</text></g><g transform="translate(24 788.72)"><use href="#t21" /><text x="23.4" y="0" textLength="748.8">Choose Postgres if the demo specifically needs to reproduce a production Postgres environment or</text></g><g transform="translate(24 810.72)"><text x="23.4" y="0" textLength="343.2">demonstrate Postgres-specific functionality.</text></g><g transform="translate(24 832.72)"><use href="#t21" /><text x="23.4" y="0" textLength="834.6">Start with a SQLite database file on persistent local storage and a seed script that makes the demo easy to</text></g><g transform="translate(24 854.72)"><text x="23.4" y="0" textLength="46.8">reset.</text></g><g transform="translate(24 920.72)"><use href="#t25" /></g></g><g fill="#eeeeee" class="theme-dark"><rect width="906" height="950" rx="8" fill="#191919" /><g transform="translate(24 62.72)"><use href="#t0" /></g><g transform="translate(24 84.72)"><use href="#t1" /></g><g transform="translate(24 106.72)"><use href="#t2" /></g><g transform="translate(24 128.72)"><use href="#t3" /></g><g transform="translate(24 150.72)"><use href="#t4" /></g><g transform="translate(24 216.72)"><use href="#t10" /></g><g transform="translate(24 238.72)"><use href="#t11" /></g><g transform="translate(24 304.72)"><use href="#t12" /></g><g transform="translate(24 326.72)"><use href="#t13" /></g><g transform="translate(24 348.72)"><use href="#t14" /></g><rect x="24" y="398" width="109.2" height="22" class="p11" /><rect x="133.2" y="398" width="179.4" height="22" class="p11" /><rect x="312.6" y="398" width="7.8" height="22" class="p11" /><rect x="320.4" y="398" width="54.6" height="22" class="p11" /><rect x="375" y="398" width="15.6" height="22" class="p11" /><g transform="translate(24 414.72)"><use href="#t15" /><use href="#t16" /><use href="#t18" /></g><g transform="translate(24 458.72)"><use href="#t19" /><use href="#t20" /><text x="265.2" y="0" textLength="288.6"> is typically the recommended choice:</text></g><g transform="translate(24 502.72)"><use href="#t21" /><text x="23.4" y="0" textLength="54.6">Choose </text><text x="78" y="0" textLength="46.8" class="b">SQLite</text><text x="124.8" y="0" textLength="733.2"> by default because it requires zero infrastructure setup, runs embedded in-process, and keeps</text></g><g transform="translate(24 524.72)"><text x="23.4" y="0" textLength="304.2">the database in a single portable file.</text></g><g transform="translate(24 546.72)"><use href="#t21" /><text x="23.4" y="0" textLength="62.4">Opt for </text><text x="85.8" y="0" textLength="62.4" class="b">Postgres</text><text x="148.2" y="0" textLength="608.4"> only if your demo explicitly highlights Postgres-exclusive features, such as </text><text x="756.6" y="0" textLength="62.4" fill="#808000">pgvector</text><text x="819" y="0" textLength="7.8">,</text></g><g transform="translate(24 568.72)"><text x="23.4" y="0" textLength="444.6">specialized extensions, or advanced concurrency controls.</text></g><g transform="translate(24 590.72)"><use href="#t21" /><text x="23.4" y="0" textLength="819">SQLite minimizes operational friction, making the demo significantly faster to distribute, run, and reset</text></g><g transform="translate(24 612.72)"><text x="23.4" y="0" textLength="132.6">for stakeholders.</text></g><rect x="24" y="662" width="62.4" height="22" class="p16" /><rect x="86.4" y="662" width="85.8" height="22" class="p16" /><rect x="172.2" y="662" width="7.8" height="22" class="p16" /><rect x="180" y="662" width="54.6" height="22" class="p16" /><rect x="234.6" y="662" width="15.6" height="22" class="p16" /><g transform="translate(24 678.72)"><use href="#t22" /><use href="#t23" /><text x="156" y="0" textLength="54.6" fill="#1f2937" class="i">(72.9s)</text></g><g transform="translate(24 744.72)"><use href="#t21" /><use href="#t24" /><text x="70.2" y="0" textLength="288.6" class="b">use SQLite for a single-node demo app</text><text x="358.8" y="0" textLength="7.8">.</text></g><g transform="translate(24 766.72)"><use href="#t21" /><text x="23.4" y="0" textLength="834.6">It stores data locally and avoids running a separate database service, making the demo easier to set up and</text></g><g transform="translate(24 788.72)"><text x="23.4" y="0" textLength="93.6">distribute. </text><text x="117" y="0" textLength="132.6" class="u p14">SQLite’s guidance</text><text x="249.6" y="0" textLength="366.6"> explicitly supports standalone demonstrations.</text></g><g transform="translate(24 810.72)"><use href="#t21" /><text x="23.4" y="0" textLength="795.6">Choose Postgres if the demo’s purpose is to validate an existing Postgres production setup; otherwise,</text></g><g transform="translate(24 832.72)"><text x="23.4" y="0" textLength="234">SQLite keeps the work smaller.</text></g><g transform="translate(24 898.72)"><use href="#t25" /></g></g></g><defs><text x="0" y="0" textLength="124.8" class="b p2" id="t0">✗ grok-cli error</text><text x="23.4" y="0" textLength="834.6" class="d p3" id="t1">Error from grok CLI: Not signed in. To authenticate without a browser, run:   grok login --device-code  Alt</text><text x="0" y="0" textLength="858" class="d p3" id="t2">ernatively, set the XAI_API_KEY environment variable or run `grok login` on a machine with a browser. Error: N</text><text x="0" y="0" textLength="858" class="d p3" id="t3">ot signed in. To authenticate without a browser, run:   grok login --device-code  Alternatively, set the XAI_A</text><text x="0" y="0" textLength="592.8" class="d p3" id="t4">PI_KEY environment variable or run `grok login` on a machine with a browser.</text><text x="23.4" y="0" textLength="7.8" class="b p4" id="t5">⠸</text><text x="241.8" y="0" textLength="39" class="b p4" id="t6">codex</text><text x="296.4" y="0" textLength="85.8" fill="#3b82f6" class="b" id="t7">antigravity</text><text x="397.8" y="0" textLength="62.4" fill="#3f3f46" class="b" id="t8">kimi-cli</text><text x="475.8" y="0" textLength="78" fill="#71717a" class="b" id="t9">cursor-cli</text><text x="0" y="0" textLength="124.8" class="b p2" id="t10">✗ kimi-cli error</text><text x="23.4" y="0" textLength="382.2" class="d p3" id="t11">Error from kimi CLI: Error: 429 Too Many Requests</text><text x="0" y="0" textLength="140.4" class="b p2" id="t12">✗ cursor-cli error</text><text x="23.4" y="0" textLength="834.6" class="d p3" id="t13">Error from cursor-agent CLI: ActionRequiredError: You've hit your usage limit Get Cursor Pro for more Agent</text><text x="0" y="0" textLength="249.6" class="d p3" id="t14"> usage, unlimited Tab, and more.</text><text x="0" y="0" textLength="109.2" class="b p12" id="t15">  ANTIGRAVITY </text><text x="109.2" y="0" textLength="179.4" fill="#93c5fd" class="i" id="t16">Gemini 3.8 Flash (High)</text><text x="296.4" y="0" textLength="54.6" class="i p12" id="t17">(15.6s)</text><text x="296.4" y="0" textLength="54.6" class="i p12" id="t18">(17.3s)</text><text x="0" y="0" textLength="218.4" id="t19">For a single-node demo app, </text><text x="218.4" y="0" textLength="46.8" class="b" id="t20">SQLite</text><text x="0" y="0" textLength="23.4" class="p14" id="t21"> • </text><text x="0" y="0" textLength="62.4" fill="#1f2937" class="b" id="t22">  CODEX </text><text x="62.4" y="0" textLength="85.8" class="i p4" id="t23">gpt-6-astra</text><text x="23.4" y="0" textLength="46.8" id="t24">Alex, </text><text x="0" y="0" textLength="585" class="d" id="t25">[r] retry failed (grok-cli, kimi-cli, cursor-cli) · [esc/ctrl-d] close  12s</text></defs></svg>